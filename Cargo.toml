[package]
name = "surroundead"
version = "0.1.0"
edition = "2024"
default-run = "surroundead"

[dependencies]
bevy = { version = "0.20.0", features = ["wav"] }
crossterm = "0.29.0"
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.34"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unpak = "1.0.5"
unreal_asset = "0.1.16"

# The map streams ~100k mesh instances; unoptimised Bevy is too slow to walk around in.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
